<div style="width: 90%; max-width: 1200px; height: 90%; background: #1a1a24; border: 2px solid #4477ff; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; overflow: hidden;">
    
    <div style="background: #111; padding: 15px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
        <h2 style="color: #4477ff; margin: 0;">📖 The Compendium</h2>
        <button class="ui-btn" style="background: #c53131; font-weight: bold;" onclick="closeCompendium()">✖ Close</button>
    </div>

    <div style="display: flex; flex-grow: 1; overflow: hidden;">
        
        <div style="width: 300px; background: #15151a; border-right: 1px solid #333; display: flex; flex-direction: column;">
            <div style="padding: 15px; border-bottom: 1px solid #333;">
                <input type="text" id="comp-search" placeholder="Search..." style="width: 100%; background: #0f0f13; color: white; border: 1px solid #444; border-radius: 4px; padding: 10px; margin-bottom: 10px; box-sizing: border-box;" onkeyup="renderCompendiumList()">
                <select id="comp-category" style="width: 100%; background: #0f0f13; color: white; border: 1px solid #444; border-radius: 4px; padding: 10px; box-sizing: border-box;" onchange="renderCompendiumList()">
                    <option value="spells">✨ Spells</option>
                    <option value="feats">🏅 Feats</option>
                    <option value="races">👤 Races</option>
                    <option value="classes">⚔️ Classes</option>
                    <option value="items">🎒 Items</option>
                    <option value="monsters">🐉 Monsters</option>
                </select>
            </div>
            <div id="comp-list" style="flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px;">
                </div>
        </div>

        <div id="comp-display" style="flex-grow: 1; padding: 40px; overflow-y: auto; background: #0f0f13; color: #ccc;">
            <div style="height: 100%; display: flex; justify-content: center; align-items: center; color: #666;">
                Search for a rule, spell, or item on the left to view its details.
            </div>
        </div>
        
    </div>
</div>
