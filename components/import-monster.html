<div class="modal-box" style="width: 600px; text-align: left;">
    <h2 style="color: #ffcc00; margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px;">🤖 AI Monster Importer</h2>
    <p style="color: #aaa; font-size: 13px;">Paste the JSON code generated by your AI below.</p>
    
    <textarea id="import-json-data" placeholder="Paste JSON here..." style="width: 100%; height: 300px; background: #0a0a0f; color: #44ff44; font-family: monospace; font-size: 13px; border: 1px solid #333; border-radius: 4px; padding: 10px; resize: vertical; box-sizing: border-box;"></textarea>
    
    <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="ui-btn" style="flex: 1; background: #4477ff; font-weight: bold;" onclick="processMonsterImport()">Import to Vault</button>
        <button class="ui-btn" style="flex: 1; background: #444;" onclick="closeMonsterImport()">Cancel</button>
    </div>
</div>
