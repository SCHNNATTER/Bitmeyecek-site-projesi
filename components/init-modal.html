<div class="modal-box">
    <h3 style="color: white; margin-top: 0;">Add to Initiative</h3>
    <input type="text" id="init-name" placeholder="Name" style="width: 100%; margin-bottom: 10px; padding: 8px; background: #111; color: white;">
    <input type="number" id="init-score" placeholder="Roll" style="width: 100%; margin-bottom: 15px; padding: 8px; background: #111; color: white;">
    <div style="display: flex; gap: 10px;">
        <button class="ui-btn" style="flex: 1; background: #4477ff;" onclick="addInitiative()">Add</button>
        <button class="ui-btn" style="flex: 1;" onclick="closeInitiativeModal()">Cancel</button>
    </div>
</div>
